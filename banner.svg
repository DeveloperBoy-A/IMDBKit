<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="TOKYO_UPDATES banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070312"/>
      <stop offset="0.55" stop-color="#2b0b45"/>
      <stop offset="1" stop-color="#9c2a62"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5d7a"/>
      <stop offset="1" stop-color="#ff2e63" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff9ec0"/>
    </linearGradient>
    <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a5c"/>
      <stop offset="1" stop-color="#150625"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff" opacity="0.7">
    <circle cx="80" cy="40" r="1.5"/><circle cx="210" cy="90" r="1"/><circle cx="330" cy="30" r="1.4"/>
    <circle cx="470" cy="70" r="1"/><circle cx="560" cy="25" r="1.6"/><circle cx="640" cy="95" r="1"/>
    <circle cx="760" cy="40" r="1.3"/><circle cx="1010" cy="35" r="1.4"/><circle cx="1150" cy="80" r="1"/>
    <circle cx="1230" cy="30" r="1.5"/><circle cx="400" cy="120" r="1"/><circle cx="1090" cy="120" r="1"/>
  </g>

  <!-- sun + Fuji -->
  <circle cx="900" cy="235" r="125" fill="url(#sun)" filter="url(#glow)"/>
  <polygon points="590,400 900,165 1210,400" fill="url(#fuji)"/>
  <polygon points="858,200 900,165 942,200 920,212 900,200 880,214" fill="#f4e9ff" opacity="0.95"/>

  <!-- torii gate -->
  <g fill="#ff2e63" filter="url(#glow)">
    <rect x="1010" y="255" width="12" height="105"/>
    <rect x="1098" y="255" width="12" height="105"/>
    <rect x="1000" y="262" width="120" height="9"/>
    <path d="M990 246 Q1060 258 1130 246 L1130 256 Q1060 268 990 256 Z"/>
    <rect x="1038" y="271" width="44" height="6"/>
  </g>

  <!-- skyline -->
  <g fill="#0d0418">
    <rect x="0" y="335" width="70" height="65"/><rect x="70" y="310" width="48" height="90"/>
    <rect x="118" y="345" width="62" height="55"/><rect x="180" y="300" width="40" height="100"/>
    <rect x="220" y="330" width="80" height="70"/><rect x="300" y="318" width="52" height="82"/>
    <rect x="352" y="348" width="70" height="52"/><rect x="422" y="305" width="44" height="95"/>
    <rect x="466" y="338" width="90" height="62"/><rect x="556" y="352" width="60" height="48"/>
    <rect x="1130" y="340" width="70" height="60"/><rect x="1200" y="312" width="80" height="88"/>
    <rect x="230" y="285" width="6" height="45"/><rect x="437" y="280" width="4" height="25"/>
  </g>
  <g fill="#ffd166" opacity="0.85">
    <rect x="80" y="322" width="4" height="5"/><rect x="96" y="338" width="4" height="5"/>
    <rect x="190" y="314" width="4" height="5"/><rect x="204" y="340" width="4" height="5"/>
    <rect x="310" y="332" width="4" height="5"/><rect x="332" y="352" width="4" height="5"/>
    <rect x="432" y="320" width="4" height="5"/><rect x="448" y="350" width="4" height="5"/>
    <rect x="1215" y="326" width="4" height="5"/><rect x="1245" y="350" width="4" height="5"/>
  </g>

  <!-- sakura petals -->
  <g fill="#ffb7d1" opacity="0.9">
    <ellipse cx="640" cy="150" rx="6" ry="3.5" transform="rotate(30 640 150)"/>
    <ellipse cx="700" cy="230" rx="5" ry="3" transform="rotate(-20 700 230)"/>
    <ellipse cx="1180" cy="170" rx="6" ry="3.5" transform="rotate(50 1180 170)"/>
    <ellipse cx="1230" cy="250" rx="5" ry="3" transform="rotate(10 1230 250)"/>
    <ellipse cx="560" cy="260" rx="5" ry="3" transform="rotate(-40 560 260)"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="60" y="165" font-size="20" fill="#ff9ec0" letter-spacing="6" font-weight="600">東京  •  TOKYO</text>
    <text x="60" y="230" font-size="60" font-weight="800" fill="url(#title)" letter-spacing="2">TOKYO_UPDATES</text>
    <text x="62" y="270" font-size="22" fill="#e9d8ff" letter-spacing="1">IMDBKit · IMDb + TMDB metadata engine</text>
    <rect x="62" y="288" width="270" height="4" rx="2" fill="#ff2e63"/>
  </g>
</svg>
